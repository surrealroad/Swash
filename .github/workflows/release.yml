name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build, Package & Release
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper changelog/release notes generation

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Signing Certificate
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-keychain-pass' }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Decode p12 certificate and import into keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MACOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Determine Code Sign Identity
          IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -o '".*"' | head -1 | tr -d '"')
          fi
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build macOS App
        run: |
          VERSION="1.0.${{ github.run_number }}"
          BUILD_NUMBER="${{ github.run_number }}"

          if [ -n "$CODE_SIGN_IDENTITY" ]; then
            echo "Building Swash with Code Sign Identity: $CODE_SIGN_IDENTITY"
            xcodebuild -scheme Swash \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          else
            echo "No signing identity found. Falling back to ad-hoc signing."
            xcodebuild -scheme Swash \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="-" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          fi

      - name: Package App Bundle & Sign DMG
        run: |
          APP_PATH="build/Build/Products/Release/Swash.app"

          # Verify App Bundle Code Signature
          echo "Verifying Swash.app code signature..."
          codesign --verify --verbose=4 --deep --strict "$APP_PATH" || true
          codesign -dv --verbose=4 "$APP_PATH"

          # Create ZIP archive
          cd build/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/Swash-macOS.zip" Swash.app
          cd "$GITHUB_WORKSPACE"

          # Create DMG Disk Image
          mkdir dmg_root
          cp -R "$APP_PATH" dmg_root/
          hdiutil create -volname "Swash" -srcfolder dmg_root -ov -format UDZO Swash-macOS.dmg
          rm -rf dmg_root

          # Code Sign DMG if identity is available
          if [ -n "$CODE_SIGN_IDENTITY" ]; then
            echo "Codesigning Swash-macOS.dmg..."
            codesign --force --sign "$CODE_SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" Swash-macOS.dmg
            echo "Verifying Swash-macOS.dmg code signature..."
            codesign --verify --verbose=4 --strict Swash-macOS.dmg
            codesign -dv --verbose=4 Swash-macOS.dmg
          fi

      - name: Notarize & Staple (Optional)
        if: ${{ secrets.NOTARIZATION_APPLE_ID != '' && secrets.NOTARIZATION_PASSWORD != '' && secrets.NOTARIZATION_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          echo "Submitting Swash-macOS.dmg for notarization..."
          xcrun notarytool submit Swash-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --password "$PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          echo "Stapling notarization ticket to Swash-macOS.dmg..."
          xcrun staple Swash-macOS.dmg

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Swash v1.0.${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Swash-macOS.dmg
            Swash-macOS.zip

      - name: Clean up Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
