name: PR Build

# Builds the app with the same runner and Xcode as the release workflow, so code that only
# compiles with a newer local SDK is caught before it reaches main.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS App
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # FormatManifest.generated.swift is committed so Xcode never needs Node; fail if it is stale
      - name: Check generated format manifest
        run: |
          node scripts/generate_format_manifest.mjs
          git diff --exit-code Swash/Markdown/FormatManifest.generated.swift

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -scheme Swash \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-"

      - name: Math and Mermaid rendering tests
        run: scripts/run_rich_render_tests.sh

      - name: Markdown conformance tests (@pixerate/markdown-conformance)
        run: scripts/run_conformance_tests.sh

      - name: MacAppKitExtras package tests
        run: swift test --package-path Packages/MacAppKitExtras

  build-ios:
    name: Build iOS App (Simulator)
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, iOS Simulator, unsigned)
        run: |
          xcodebuild -scheme Swash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
