name: PR Build

# Builds the app with the same runner and Xcode as the release workflow, so code that only
# compiles with a newer local SDK is caught before it reaches main.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS App
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -scheme Swash \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-"

      - name: Math and Mermaid rendering tests
        run: scripts/run_rich_render_tests.sh
